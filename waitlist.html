<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join the Waitlist — FindMyBiz</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="container" style="padding:140px 0 80px;max-width:520px;">
    <h1>Join the waitlist</h1>
    <p>Tell us about your business and we will contact you with early access.</p>
    <form action="#" method="post">
      <label>Name <input type="text" name="name" required></label><br>
      <label>Work email <input type="email" name="email" required></label><br>
      <label>Business website <input type="url" name="website"></label><br>
      <label>What do customers ask AI about your business? <textarea name="question" rows="3"></textarea></label><br>
      <button type="submit" class="nav__cta shiny-cta">Join waitlist</button>
    </form>
    <p><a href="index.html">Back to home</a></p>
  </main>
</body>
</html>
