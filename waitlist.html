<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join the Waitlist — FindMyBiz</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/findmybiz.css">
</head>
<body>
  <div class="wrap">
    <header class="top"><a href="index.html"><img src="logo.svg" alt="FindMyBiz"></a></header>
    <section style="max-width:560px;margin:0 auto;">
      <h1 style="font-size:36px;margin:0 0 8px;text-align:center;">Join the waitlist</h1>
      <p class="lead" style="text-align:center;">Tell us about your business and we will contact you with early access.</p>
      <form class="waitlist" action="#" method="post">
        <label>Name <input type="text" name="name" required></label>
        <label>Work email <input type="email" name="email" required></label>
        <label>Business website <input type="url" name="website"></label>
        <label>What do customers ask AI about your business? <textarea name="question" rows="3"></textarea></label>
        <button type="submit" class="btn">Join waitlist</button>
      </form>
      <p class="note"><a href="index.html">Back to home</a></p>
    </section>
  </div>
</body>
</html>
